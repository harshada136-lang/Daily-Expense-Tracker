{% extends 'base.html' %}
{% block content %}
<div class="panel panel-default auth-panel">
    <div class="panel-heading"><strong>Login</strong></div>
    <div class="panel-body">
        <div class="auth-title">
            <h2>Welcome Back</h2>
            <p>Sign in to manage your daily expenses.</p>
            <div style="margin: 18px 0 22px; padding: 12px 10px; background: #f5f8fc; border-left: 4px solid #30a5ff; border-radius: 4px;">
                <div style="font-size: 13px; font-weight: 700; color: #30a5ff; letter-spacing: 1px;">
                    BCA FIELD PROJECT
                </div>
                <div style="font-size: 13px; color: #555; margin-top: 5px;">
                    Developed by <strong>Harshada Patil &amp; Disha Mahale</strong>
                </div>
            </div>
        </div>

        <form method="post">
            <div class="form-group">
                <label>Email</label>
                <input class="form-control" type="email" name="email" placeholder="E-mail" required autofocus>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input class="form-control" type="password" name="password" placeholder="Password" required>
            </div>
            <p class="text-right"><a href="{{ url_for('forgot_password') }}">Forgot Password?</a></p>
            <button class="btn btn-primary btn-block" type="submit">Login</button>
        </form>

        <hr>
        <p class="text-center">Don't have an account? <a href="{{ url_for('register') }}">Register</a></p>
    </div>
</div>
{% endblock %}
