{% extends 'base.html' %}{% block content %}<div class="row"><div class="col-lg-12"><div class="panel panel-default"><div class="panel-heading">Expense</div><div class="panel-body"><div class="col-md-12"><form method="post"><div class="form-group"><label>Date of Expense</label><input class="form-control" type="date" name="dateexpense" value="{{ today_iso }}" required></div><div class="form-group"><label>Item</label><input class="form-control" type="text" name="item" placeholder="Enter expense item" maxlength="200" required></div><div class="form-group"><label>Cost of Item (₹)</label><input class="form-control" type="number" name="costitem" min="0.01" step="0.01" placeholder="Enter amount" required></div><button class="btn btn-primary" type="submit">Add</button> <a class="btn btn-default" href="{{ url_for('manage_expense') }}">Cancel</a></form></div></div></div></div></div>{% endblock %}
