{% extends 'base.html' %}{% block content %}<div class="panel panel-default auth-panel"><div class="panel-heading"><strong>Forgot Password</strong></div><div class="panel-body"><div class="auth-title"><h2>Reset Password</h2><p>Verify your registered email and mobile number.</p></div><form method="post"><div class="form-group"><label>Email</label><input class="form-control" type="email" name="email" required></div><div class="form-group"><label>Mobile Number</label><input class="form-control" name="contactno" maxlength="10" required></div><button class="btn btn-primary" type="submit">Continue</button> <a class="btn btn-default" href="{{ url_for('login') }}">Login</a></form></div></div>{% endblock %}
