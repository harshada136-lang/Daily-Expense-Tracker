{% extends 'base.html' %}{% block content %}<div class="panel panel-default auth-panel"><div class="panel-heading"><strong>Create Account</strong></div><div class="panel-body"><div class="auth-title"><h2>Register</h2><p>Create your Daily Expense Tracker account.</p></div><form method="post"><div class="form-group"><label>Full Name</label><input class="form-control" name="name" placeholder="Full Name" required></div><div class="form-group"><label>Email</label><input class="form-control" name="email" type="email" placeholder="E-mail" required></div><div class="form-group"><label>Mobile Number</label><input class="form-control" name="mobilenumber" maxlength="10" pattern="[0-9]{10}" placeholder="10-digit mobile number" required></div><div class="form-group"><label>Password</label><input class="form-control" type="password" name="password" minlength="6" required></div><div class="form-group"><label>Repeat Password</label><input class="form-control" type="password" name="repeatpassword" minlength="6" required></div><button class="btn btn-primary" type="submit">Register</button> <a class="btn btn-default" href="{{ url_for('login') }}">Login</a></form></div></div>{% endblock %}
