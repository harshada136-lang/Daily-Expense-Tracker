{% extends 'base.html' %}{% block content %}<div class="panel panel-default auth-panel"><div class="panel-heading"><strong>Login</strong></div><div class="panel-body"><div class="auth-title"><h2>Welcome Back</h2><p>Sign in to manage your daily expenses.</p></div><form method="post"><div class="form-group"><label>Email</label><input class="form-control" type="email" name="email" placeholder="E-mail" required autofocus></div><div class="form-group"><label>Password</label><input class="form-control" type="password" name="password" placeholder="Password" required></div><p class="text-right"><a href="{{ url_for('forgot_password') }}">Forgot Password?</a></p><button class="btn btn-primary btn-block" type="submit">Login</button></form><hr><p class="text-center">Don't have an account? <a href="{{ url_for('register') }}">Register</a></p></div></div>{% endblock %}
