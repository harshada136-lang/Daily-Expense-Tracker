{% extends 'base.html' %}{% block content %}<div class="row"><div class="col-lg-12"><h1 class="page-header">User Profile</h1></div></div><div class="row"><div class="col-md-8"><div class="panel panel-default"><div class="panel-heading">Profile Details</div><div class="panel-body"><form method="post"><div class="form-group"><label>Full Name</label><input class="form-control" name="fullname" value="{{ user['FullName'] }}" required></div><div class="form-group"><label>Email</label><input class="form-control" type="email" name="email" value="{{ user['Email'] }}" required></div><div class="form-group"><label>Mobile Number</label><input class="form-control" name="contactnumber" value="{{ user['MobileNumber'] }}" maxlength="10" pattern="[0-9]{10}" required></div><div class="form-group"><label>Registration Date</label><input class="form-control" value="{{ user['RegDate'] }}" readonly></div><button class="btn btn-primary" type="submit">Update</button></form></div></div></div></div>{% endblock %}
